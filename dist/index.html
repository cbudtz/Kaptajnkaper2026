<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000028" />
    <title>Kaptajn Kaper i Kattegat</title>
    <meta
      name="description"
      content="Kaptajn Kaper i Kattegat — Phaser remake based on Peter Ole Frederiksen's 1985 classic (GPL-3.0)."
    />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <style>
      html {
        height: 100%;
        height: -webkit-fill-available;
      }
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        min-height: -webkit-fill-available;
        background: #000028;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      #app-shell {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        background: #000028;
        overflow: hidden;
        height: var(--app-height, 100dvh);
        max-height: var(--app-height, 100dvh);
      }
      #game-container {
        flex: 0 0 auto;
        height: var(--game-band-height, 55dvh);
        max-height: var(--game-band-height, 55dvh);
        min-height: 0;
        width: 100%;
      }
      #mobile-ui {
        display: none;
        flex: 0 0 auto;
        flex-direction: column;
        height: var(--mobile-deck-height, 280px);
        min-height: var(--mobile-deck-height, 280px);
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px max(10px, env(safe-area-inset-bottom));
        background: linear-gradient(180deg, #0a0a5a, #000028);
        border-top: 3px solid #6666ff;
      }
      html.touch-device #mobile-ui:not([hidden]) {
        display: flex;
      }
      #mobile-name-input {
        font-size: 16px;
      }
      #mobile-deck {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-height: 0;
      }
      #mobile-deck .mobile-btn {
        flex: 1;
        min-height: 48px;
        border: 2px solid #aaaaff;
        border-radius: 12px;
        background: #0000b0;
        color: #fff;
        font-size: 17px;
        font-weight: 700;
        font-family: system-ui, sans-serif;
        -webkit-appearance: none;
        appearance: none;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-DowYA_g_.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-xIRvw7_e.css">
  </head>
  <body>
    <div id="app-shell">
      <div id="mobile-hint" class="visible"></div>
      <div id="game-container"></div>

      <div id="mobile-ui" hidden aria-label="Spilkontroller">
        <p id="mobile-caption"></p>
        <div id="mobile-name-block" hidden>
          <label for="mobile-name-input">Kaptajnens navn</label>
          <input
            id="mobile-name-input"
            type="text"
            autocomplete="nickname"
            enterkeyhint="done"
            maxlength="20"
            placeholder="Dit navn"
          />
        </div>
        <div id="mobile-deck"></div>
      </div>
    </div>
  </body>
</html>
